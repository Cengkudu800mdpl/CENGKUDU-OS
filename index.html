<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENGKUDU-OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0f0f1a;color:#fff;overflow:hidden;height:100vh}
#boot{position:fixed;inset:0;background:#0f0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#boot h1{font-size:48px;letter-spacing:4px}
#boot h1 span{color:#a78bfa}
#boot p{color:#aaa;margin-top:10px}
#bar{width:260px;height:8px;background:#222;border-radius:99px;margin-top:25px;overflow:hidden}
#fill{height:100%;width:0%;background:#a78bfa;transition:.3s}
#desktop{display:none;height:100vh;background:linear-gradient(135deg,#1e1b4b,#312e81,#0f0f1a);padding:20px}
#top{font-size:13px;opacity:.8;display:flex;justify-content:space-between}
#icons{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:25px}
.icon{text-align:center;cursor:pointer}
.icon div{font-size:38px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:18px;padding:16px 0;border:1px solid rgba(255,255,255,.15)}
.icon span{font-size:12px;display:block;margin-top:6px}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:52px;background:rgba(0,0,0,.6);backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid rgba(255,255,255,.1)}
#taskbar button{background:#fff;color:#000;border:0;padding:9px 18px;border-radius:99px;font-weight:700;cursor:pointer}
#taskbar span{font-size:12px;opacity:.8}
