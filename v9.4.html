<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENGKUDU OS v9.4 - AI Video Pitch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#000;border-bottom:1px solid #333}
.brand{display:flex;align-items:center;gap:8px;font-weight:bold}
.logo{width:32px;height:32px;background:#5a3d1e;border-radius:50%;display:flex;align-items:center;justify-content:center}
.wrap{padding:14px;max-width:900px;margin:auto}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:14px;padding:14px}
.chat{background:#26211d;padding:14px;border-radius:12px;margin-bottom:10px;line-height:1.6;white-space:pre-wrap}
.chat b{color:#fff}
.me{background:#5a3d1e}
.row{display:flex;gap:8px;margin-top:10px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:15px}
button{padding:12px 16px;border:0;border-radius:10px;background:#c98a2e;color:#000;font-weight:bold;cursor:pointer}
.small{color:#aaa;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div class="brand"><div class="logo">☕</div>CENGKUDU OS v9.4</div><div>AI Video Pitch</div></div>
<div class="wrap">
<div class="card" id="chatBox">
<div class="chat"><b>Muse AI:</b><br>Halo Komandan! Mau bikin ide video pitch kopi Cengkudu yang kayak gimana? Tulis aja di bawah.</div>
</div>
<div class="row">
<input id="chatInput" placeholder="Tulis ide lu... contoh: bikinin video kopi cengkudu">
<button onclick="sendChat()">Kirim</button>
</div>
<div class="small">Nyambung ke Vercel /api/chat - Muse Spark 1.3</div>
</div>
<script>
async function sendChat(){
  var input = document.getElementById('chatInput');
  var v = input.value.trim();
  if(!v) return alert('Tulis dulu ide lu');
  var box = document.getElementById('chatBox');
  var me = document.createElement('div');
  me.className = 'chat me';
  me.innerHTML = '<b>Kamu:</b><br>' + v;
  box.appendChild(me);
  input.value = '';
  var loading = document.createElement('div');
  loading.className = 'chat';
  loading.innerText = 'Muse lagi mikir...';
  box.appendChild(loading);
  box.scrollIntoView({behavior:'smooth', block:'end'});
  try{
    var r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:v})});
    var d = await r.json();
    loading.innerHTML = '<b>Muse AI:</b><br>' + (d.reply || d.error || 'Gak ada balasan');
  }catch(e){
    loading.innerText = 'Gagal nyambung ke /api/chat. Cek Vercel udah Redeploy belum.';
  }
}
document.getElementById('chatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendChat(); });
</script>
</body>
</html>
